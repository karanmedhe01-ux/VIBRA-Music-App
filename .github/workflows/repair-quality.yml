name: Repair VIBRA quality

on:
  push:
    branches:
      - chore/vibra-quality-upgrade

permissions:
  contents: write

jobs:
  repair:
    if: ${{ github.actor == 'karanmedhe01-ux' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/vibra-quality-upgrade
      - name: Repair FullPlayer props
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/app/page.tsx')
          s = p.read_text()
          old = '''  setProgress: (v: number) => void;\n  setDuration: (v: number) => void;\n}) {'''
          new = '''  setProgress: (v: number) => void;\n  setDuration: (v: number) => void;\n  isShuffled: boolean;\n  setIsShuffled: (v: boolean) => void;\n  isRepeating: boolean;\n  setIsRepeating: (v: boolean) => void;\n  sleepTimer: ReturnType<typeof setTimeout> | null;\n  setSleepTimer: (v: ReturnType<typeof setTimeout> | null) => void;\n  sleepMinutes: number | null;\n  setSleepMinutes: (v: number | null) => void;\n  addToLibrary: (song: Song) => void;\n  youtubeCommandRef: React.MutableRefObject<((command: string, args?: unknown[]) => void) | null>;\n}) {'''
          if old not in s:
              raise SystemExit('Expected FullPlayer prop type anchor not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit repair
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/page.tsx
          git diff --cached --quiet && exit 0
          git commit -m "fix: complete FullPlayer prop wiring"
          git push origin chore/vibra-quality-upgrade
