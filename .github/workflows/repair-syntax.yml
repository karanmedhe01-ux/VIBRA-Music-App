name: Repair VIBRA syntax

on:
  push:
    branches:
      - chore/vibra-quality-upgrade

permissions:
  contents: write

jobs:
  repair:
    if: ${{ github.actor == 'karanmedhe01-ux' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: chore/vibra-quality-upgrade
          fetch-depth: 1

      - name: Repair stray block in page.tsx
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/app/page.tsx')
          s = p.read_text()
          bad = '''    if (showPlayer) {\n      setShowPlayer(false);\n      return true;\n    }\n      return true;\n    }\n    if (navigationStackRef.current.length > 1) {'''
          good = '''    if (showPlayer) {\n      setShowPlayer(false);\n      return true;\n    }\n    if (navigationStackRef.current.length > 1) {'''
          if bad not in s:
              print('No known malformed block found; nothing to repair.')
          else:
              p.write_text(s.replace(bad, good, 1))
              print('Repaired goBack syntax block.')
          PY

      - name: Commit repair
        shell: bash
        run: |
          if git diff --quiet -- src/app/page.tsx; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/page.tsx
          git commit -m "fix: repair page navigation syntax"
          git push origin chore/vibra-quality-upgrade
